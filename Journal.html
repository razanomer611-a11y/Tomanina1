    <h2>اكتبي ما تشعرين به اليوم</h2>

    <form>
        <label for="date">التاريخ:</label>
        <input type="date" id="date">

        <br><br>

        <label for="diary">مساحة للكتابة:</label>

        <br>

        <textarea id="diary" rows="10" cols="35" placeholder="اكتبي أفكارك ومشاعرك هنا..."></textarea>

        <br><br>

        <button type="button" onclick="saveDiary()">حفظ اليوميات</button>
    </form>

    <h3>يومياتك المحفوظة</h3>
    <div id="savedEntries"></div>

    <script>
        function saveDiary() {
            const date = document.getElementById("date").value;
            const diary = document.getElementById("diary").value;

            if (!diary.trim()) {
                alert("اكتبي شيئاً أولاً.");
                return;
            }

            const entries = JSON.parse(localStorage.getItem("diaryEntries") || "[]");

            entries.push({
                date: date || new Date().toISOString().slice(0, 10),
                text: diary
            });

            localStorage.setItem("diaryEntries", JSON.stringify(entries));

            document.getElementById("diary").value = "";
            showDiary();
            alert("تم حفظ يومياتك على هذا الجهاز.");
        }

        function showDiary() {
            const entries = JSON.parse(localStorage.getItem("diaryEntries") || "[]");
            const container = document.getElementById("savedEntries");

            container.replaceChildren();

            entries.forEach(function(entry) {
                const paragraph = document.createElement("p");
                paragraph.textContent = entry.date + " — " + entry.text;
                container.appendChild(paragraph);
            });
        }

        showDiary();
    </script>

    <a href="Home.html">العودة إلى الرئيسية</a>
