<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>طمأنينة | تسجيل الدخول</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- الشعار -->
        <div class="logo">
            طمأنينة
        </div>

        <p class="welcome-text">
            مساحة صغيرة لقلبك 🤍
        </p>


        <!-- صندوق تسجيل الدخول -->
        <div class="login-box">

            <h1>
                أهلاً بك
            </h1>

            <p>
                سجّلي دخولك وابدئي رحلتك نحو الطمأنينة
            </p>


            <script>
document.querySelector("form").addEventListener("submit", function(event) {
    event.preventDefault();
    window.location.href = "home.html";
});
</script>
                <!-- البريد -->
                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >


                <!-- الباسورد -->
                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >


                <!-- زر الدخول -->
          <button type="button" onclick="login()">
    دخول إلى طمأنينة
</button>
               

            </>

        </div>

    </div>
</script>
<script>
function login() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (email === "" || password === "") {
        alert("أدخلي البريد الإلكتروني وكلمة المرور");
    } else {
        window.location.href = "home.html";
    }
}
</script>
</body>

</html>
