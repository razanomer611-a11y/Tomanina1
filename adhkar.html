    <h2>أذكار الصباح والمساء</h2>

    <p>سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.</p>

    <p>أستغفر الله وأتوب إليه.</p>

    <p>اللهم صل وسلم على نبينا محمد.</p>

    <p>لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.</p>
